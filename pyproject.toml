[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "End-to-end RAG evaluation for Turkish embedding models: retrieval, answer generation and LLM judging with paired cluster-bootstrap statistics."
requires-python = ">=3.10"
dependencies = ["numpy", "openai>=1.30"]

[project.optional-dependencies]
retrieve = ["sentence-transformers>=3", "torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
